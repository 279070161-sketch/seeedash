<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sign In - Seeedash</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-shell">
        <div class="container fade-in">
            <header class="auth-header">
                <img src="seeedash_logo.svg" alt="Seeedash">
                <h1>Sign in</h1>
                <p>Enter your password to continue</p>
            </header>

            <form id="loginForm">
                <div class="form-group">
                    <label class="label">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" value="admin@reterminal.io" readonly
                            style="background-color: var(--muted); cursor: not-allowed;">
                    </div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="label">Password</label>
                        <a href="#"
                            style="font-size: 0.75rem; color: var(--muted-foreground); text-decoration: none;">Forgot
                            password?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <div class="input-icon-right" id="togglePassword">
                            <i data-lucide="eye-off" style="width: 18px;"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Sign In</button>
            </form>

            <div style="margin-top: 2rem; text-align: center;">
                <button class="btn btn-ghost" onclick="window.location.href='login_otp.html'"
                    style="font-size: 0.875rem;">
                    <i data-lucide="mail" style="width: 16px; margin-right: 8px;"></i>
                    Login with Verification Code
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = togglePassword.querySelector('i');
            icon.setAttribute('data-lucide', type === 'password' ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'overview.html';
        });
    </script>
</body>

</html>
