<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Enter Wi-Fi Password - Seeedash</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Defensive Reset inside this file to ensure box-sizing is always correct */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Mock Background styling (matches devices.html sleepy state exactly) */
        .mock-background {
            filter: blur(6px) brightness(0.85);
            pointer-events: none;
            user-select: none;
            width: 100%;
            height: 100vh;
            max-width: 420px;
            margin: 0 auto;
            background: #fafafa;
            position: relative;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: var(--space-8) var(--space-6) var(--space-3);
            overflow: hidden;
        }

        /* Sleepy Sticker animations from devices.html */
        .sleeping-device-container {
            position: relative;
            width: 220px;
            height: 180px;
            margin: 4.5rem auto 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sleeping-device {
            width: 144px;
            height: 100px;
            border: 4.5px solid #1e293b;
            border-radius: 12px;
            background: #ffffff;
            position: relative;
            transform: perspective(300px) rotateX(12deg);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom-width: 6px;
        }

        .device-screen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .eyes {
            display: flex;
            gap: 20px;
            margin-top: -6px;
        }

        .eye {
            width: 18px;
            height: 9px;
            border-bottom: 3.5px solid #1e293b;
            border-radius: 0 0 18px 18px;
            position: relative;
        }

        .device-base {
            position: absolute;
            bottom: -9px;
            width: 164px;
            height: 5px;
            background: #1e293b;
            border-radius: 4px;
            left: 50%;
            transform: translateX(-50%);
        }

        .zzz-container {
            position: absolute;
            top: 20px;
            right: 15px;
            width: 60px;
            height: 60px;
        }

        .zzz {
            position: absolute;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            color: #1e293b;
            opacity: 0;
            animation: zzz-float 4.5s infinite linear;
        }

        .z1 {
            font-size: 14px;
            animation-delay: 0s;
            top: 30px;
            left: 10px;
        }

        .z2 {
            font-size: 20px;
            animation-delay: 1.5s;
            top: 20px;
            left: 25px;
        }

        .z3 {
            font-size: 26px;
            animation-delay: 3s;
            top: 10px;
            left: 40px;
        }

        @keyframes zzz-float {
            0% {
                transform: translate(0, 0) scale(0.6);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            80% {
                opacity: 0.8;
            }

            100% {
                transform: translate(25px, -45px) scale(1.15);
                opacity: 0;
            }
        }

        .dark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 5;
        }

        /* Bottom Sheet Modal Container with absolute margins */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            box-shadow: 0 -10px 45px rgba(0, 0, 0, 0.18);
            z-index: 10;
            padding: 24px 0 48px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            max-height: 85vh;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                transform: translate(-50%, 100%);
            }

            to {
                transform: translate(-50%, 0);
            }
        }

        .drag-handle {
            width: 38px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-bottom: 24px;
            align-self: center;
        }

        /* Large blue Wi-Fi icon styling */
        .wifi-icon-large-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            align-self: center;
        }

        .wifi-icon-large {
            color: #007aff;
            animation: wifi-pulse 2s infinite ease-in-out;
        }

        @keyframes wifi-pulse {
            0% {
                transform: scale(1);
                opacity: 0.9;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
                filter: drop-shadow(0 4px 12px rgba(0, 122, 255, 0.25));
            }

            100% {
                transform: scale(1);
                opacity: 0.9;
            }
        }

        .title-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
            margin-bottom: 8px;
            padding: 0 24px;
        }

        .subtitle-text {
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.5;
            padding: 0 24px;
        }

        /* Premium Grey Input field box */
        .input-box-wrapper {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin: 0 24px 20px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 3.25rem;
            transition: all 0.2s;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(9, 9, 11, 0.1);
        }

        .password-input {
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.95rem;
            color: #0f172a;
            width: 85%;
            font-weight: 500;
        }

        .password-input::placeholder {
            color: #94a3b8;
        }

        .eye-toggle-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: color 0.2s;
        }

        .eye-toggle-btn:hover {
            color: #0f172a;
        }

        /* Solid Action Button */
        .btn-action {
            background: var(--primary);
            color: #ffffff;
            border: none;
            width: auto;
            margin: 0 24px 0;
            font-weight: 700;
            height: 3.25rem;
            border-radius: var(--radius);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(9, 9, 11, 0.08);
            gap: 8px;
        }

        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-action:disabled {
            background: #cbd5e1;
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner style */
        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body style="background: #fafafa; margin: 0; padding: 0; overflow: hidden;">
    <!-- Dark Backdrop overlay -->
    <div class="dark-overlay"></div>

    <!-- Underlying Page (Blurred matching active Devices page) -->
    <div class="mock-background">
        <h1 style="font-size: 1.85rem; font-weight: 700; color: var(--foreground); margin-bottom: 0;">Devices</h1>

        <div class="sleeping-device-container">
            <div class="sleeping-device">
                <div class="device-screen">
                    <div class="eyes">
                        <span class="eye"></span>
                        <span class="eye"></span>
                    </div>
                </div>
                <div class="device-base"></div>
            </div>
            <div class="zzz-container">
                <span class="zzz z1">z</span>
                <span class="zzz z2">Z</span>
                <span class="zzz z3">z</span>
            </div>
        </div>

        <button class="btn btn-primary"
            style="opacity: 0.5; width: 100%; height: 3rem; font-weight: 600; border-radius: var(--radius);">Connect
            Device</button>
    </div>

    <!-- Password Bottom Sheet -->
    <div class="bottom-sheet">
        <div class="drag-handle"></div>

        <!-- Large blue Wi-Fi signal icon -->
        <div class="wifi-icon-large-container">
            <i data-lucide="wifi" class="wifi-icon-large" style="width: 72px; height: 72px;"></i>
        </div>

        <!-- Dynamic Title & Subtitle -->
        <h2 class="title-text" id="wifiTitle">Join "A205 home"</h2>
        <p class="subtitle-text">Enter the password to join this WLAN network.</p>

        <!-- Form for input -->
        <form id="passwordForm" style="display: flex; flex-direction: column;" onsubmit="handleConnect(event)">
            <div class="input-box-wrapper">
                <input type="password" id="wifiPasswordInput" class="password-input" placeholder="Password" required>
                <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility()">
                    <i data-lucide="eye-off" id="eyeIcon" style="width: 20px; height: 20px;"></i>
                </button>
            </div>

            <!-- Connect Button -->
            <button type="submit" class="btn-action" id="connectBtn">
                Connect
            </button>
        </form>
    </div>

    <script>
        // Parse Query String to obtain dynamic SSID
        const urlParams = new URLSearchParams(window.location.search);
        const ssid = urlParams.get('ssid') || 'A205 home';
        document.getElementById('wifiTitle').textContent = `Join "${ssid}"`;

        // Toggle Password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('wifiPasswordInput');
            const eyeIconElement = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIconElement.setAttribute('data-lucide', 'eye');
            } else {
                passwordInput.type = 'password';
                eyeIconElement.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        }

        // Simulate connecting with beautiful interactive loading state
        function handleConnect(event) {
            event.preventDefault();
            const connectBtn = document.getElementById('connectBtn');
            const passwordInput = document.getElementById('wifiPasswordInput');

            if (!passwordInput.value) return;

            // Make connecting state
            connectBtn.disabled = true;
            connectBtn.innerHTML = `<i data-lucide="loader-2" class="spinner" style="width: 18px; height: 18px;"></i> Connecting...`;
            lucide.createIcons();

            // After 2 seconds, redirect back to devices.html with success toast query
            setTimeout(() => {
                window.location.href = 'devices.html?wifi_success=1&ssid=' + encodeURIComponent(ssid);
            }, 2000);
        }

        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
</body>

</html>
