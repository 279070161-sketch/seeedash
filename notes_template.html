<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Note Template Editor - Seeedash</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Specific Styles for Note Template Page */
        .page-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .page-back-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            width: 32px;
            height: 32px;
        }

        .page-back-btn:hover {
            opacity: 0.7;
        }

        .btn-deploy {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(9, 9, 11, 0.1);
        }

        .btn-deploy:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-deploy:active {
            transform: translateY(0);
        }

        .btn-deploy.deploying {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }

        .details-content {
            padding: 1.25rem 1.25rem 3rem;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
            min-height: calc(100vh - 68px);
            box-sizing: border-box;
            gap: 1.5rem;
        }

        /* Preview Section container */
        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--muted-foreground);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .see-all-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 4px;
        }

        .see-all-btn:hover {
            opacity: 0.8;
        }

        /* E-Ink Preview Container (5:3 default landscape) */
        .preview-box-wrapper {
            background: rgba(9, 9, 11, 0.02);
            border: 2px dashed rgba(9, 9, 11, 0.08);
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .preview-box {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 5 / 3;
            background: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 1.25rem;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #000000;
        }

        /* Orientation state rules */
        .preview-box.portrait {
            width: 180px;
            aspect-ratio: 3 / 5;
        }

        /* Default orientation CSS variables (Portrait) */
        body.portrait-mode {
            --bg-minimal: url('note1_s.png');
            --bg-classic: url('note2_s.png');
            --bg-spiral: url('note3_s.png?v=3.2');
            --thumb-width: 30px;
            --thumb-height: 48px;
        }

        /* Landscape orientation CSS variables */
        body:not(.portrait-mode) {
            --bg-minimal: url('note1_h.png');
            --bg-classic: url('note2_h.png');
            --bg-spiral: url('note3_h.png?v=3.2');
            --thumb-width: 48px;
            --thumb-height: 30px;
        }

        /* Template Specific Styling inside preview box using background images */
        .preview-box.template-minimal {
            background-image: var(--bg-minimal);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            padding: 1.5rem;
        }

        .preview-box.template-classic {
            background-image: var(--bg-classic);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            padding: 1.5rem;
        }

        .preview-box.template-spiral {
            background-image: var(--bg-spiral);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            padding: 1.5rem 1.5rem 1.5rem 2.2rem;
        }
        .preview-box.template-spiral:not(.portrait) {
            padding: 2.2rem 1.5rem 1.5rem 1.5rem;
        }

        /* Note Text Content */
        .preview-note-text {
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.5;
            color: #000000;
            z-index: 2;
            width: 100%;
            outline: none;
            word-break: break-word;
        }

        .template-shopping .preview-note-text {
            text-align: left;
            font-size: 0.88rem;
            line-height: 24px;
        }

        /* Orientation Toggle Bar */
        .orientation-toggle-bar {
            display: flex;
            justify-content: center;
            gap: 1.25rem;
            margin-top: 0.25rem;
        }

        .orientation-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--muted-foreground);
        }

        .orientation-btn:hover {
            color: var(--foreground);
            border-color: #cbd5e1;
        }

        .orientation-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(9, 9, 11, 0.15);
        }

        /* Simple rectangular orientation representations */
        .icon-rect-landscape {
            width: 22px;
            height: 14px;
            border: 2px solid currentColor;
            border-radius: 2px;
            display: inline-block;
        }

        .icon-rect-portrait {
            width: 14px;
            height: 22px;
            border: 2px solid currentColor;
            border-radius: 2px;
            display: inline-block;
        }

        /* Templates Grid */
        .templates-section {
            display: flex;
            flex-direction: column;
            gap: 0.88rem;
        }

        .templates-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--foreground);
        }

        /* Grid Layout (exactly 3 cards in a row, no scrolling) */
        .templates-scroll-list {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            width: 100%;
            box-sizing: border-box;
            padding-bottom: 8px;
        }

        .template-card {
            width: 100%;
            min-width: 0;
            height: 106px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            padding: 6px 4px;
            box-sizing: border-box;
            gap: 4px;
        }

        .template-card:hover {
            transform: translateY(-2px);
            border-color: #cbd5e1;
        }

        .template-card.active {
            border-color: var(--primary);
            border-width: 2px;
            background: #fafafa;
        }

        /* Visual style icons inside cards */
        .template-card-preview {
            width: var(--thumb-width);
            height: var(--thumb-height);
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .template-card.active .template-card-preview {
            border-color: var(--primary);
        }

        .mini-minimal {
            background-image: var(--bg-minimal);
            background-size: cover;
            background-position: center;
        }
        .mini-classic {
            background-image: var(--bg-classic);
            background-size: cover;
            background-position: center;
        }
        .mini-spiral {
            background-image: var(--bg-spiral);
            background-size: cover;
            background-position: center;
        }

        .template-card-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: #64748b;
            text-align: center;
        }

        .template-card.active .template-card-name {
            color: var(--primary);
            font-weight: 700;
        }



        /* Drawer overlay */
        .drawer-overlay {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .drawer-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-radius: 20px 20px 0 0;
            padding: 1.5rem;
            transform: translateY(100%);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.08);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .drawer-overlay.show .drawer-container {
            transform: translateY(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.88rem;
        }

        .drawer-title {
            font-size: 1rem;
            font-weight: 800;
            color: #0f172a;
        }

        .drawer-close-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            overflow-y: auto;
        }

        .notes-list-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.88rem 1rem;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.85rem;
            font-weight: 500;
            color: #334155;
            line-height: 1.4;
        }

        .notes-list-item:hover {
            border-color: var(--primary);
            background: #fafafa;
        }

        /* Toast notification */
        .toast-notification {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0f172a;
            color: #ffffff;
            padding: 0.75rem 1.25rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            font-size: 0.88rem;
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Spinner keyframes */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>

<body class="portrait-mode">
    <div class="app-shell">
        <!-- Header -->
        <header class="page-header">
            <button class="page-back-btn" onclick="window.location.href='dashboard.html'">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <button class="btn-deploy" id="deployBtn" onclick="triggerDeploy()">
                <!-- Inline Upload Cloud SVG -->
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Deploy
            </button>
        </header>

        <!-- Content Area -->
        <div class="details-content">
            <!-- Preview Section -->
            <div class="preview-section">
                <div class="preview-header">
                    <span class="preview-title">Preview</span>
                    <button class="see-all-btn" onclick="window.location.href='notes.html'">
                        See All Notes
                        <!-- Inline Chevron Right SVG -->
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 2px;">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>

                <div class="preview-box-wrapper">
                    <!-- Default Minimal template (starts portrait 3:5) -->
                    <div class="preview-box template-minimal portrait" id="previewBox">
                        <!-- Content text is editable -->
                        <div class="preview-note-text" id="noteText" contenteditable="true">Fed the cat already, don't feed her again!</div>
                    </div>
                </div>

                <!-- Orientation Toggles (Represented by clean CSS shapes as requested) -->
                <div class="orientation-toggle-bar">
                    <button class="orientation-btn" id="btnLandscape" onclick="setOrientation('landscape')">
                        <span class="icon-rect-landscape" title="Landscape"></span>
                    </button>
                    <button class="orientation-btn active" id="btnPortrait" onclick="setOrientation('portrait')">
                        <span class="icon-rect-portrait" title="Portrait"></span>
                    </button>
                </div>
            </div>

            <!-- Templates Selector -->
            <div class="templates-section">
                <span class="templates-title">Templates</span>

                <div class="templates-scroll-list">
                    <!-- Shopping list template (Initially active) -->
                    <div class="template-card active" id="tpl-minimal" onclick="selectTemplate('minimal')">
                        <div class="template-card-preview mini-minimal"></div>
                        <span class="template-card-name">Shopping list</span>
                    </div>

                    <!-- Paper Clip template -->
                    <div class="template-card" id="tpl-classic" onclick="selectTemplate('classic')">
                        <div class="template-card-preview mini-classic"></div>
                        <span class="template-card-name">Paper Clip</span>
                    </div>

                    <!-- Printer template -->
                    <div class="template-card" id="tpl-spiral" onclick="selectTemplate('spiral')">
                        <div class="template-card-preview mini-spiral"></div>
                        <span class="template-card-name">Printer</span>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- Notes Bottom Drawer -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeNotesDrawer()">
        <div class="drawer-container" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <div class="drawer-title">Saved Notes</div>
                <button class="drawer-close-btn" onclick="closeNotesDrawer()">
                    <!-- Inline X SVG -->
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="notes-list">
                <div class="notes-list-item" onclick="loadNote('Fed the cat already, don\'t feed her again!')">
                    🐾 Fed the cat already, don't feed her again!
                </div>
                <div class="notes-list-item" onclick="loadNote('Weekly team sync on Wednesday at 10:00 AM, prepared presentation slides.')">
                    📅 Weekly team sync on Wednesday at 10:00 AM, prepared slides.
                </div>
                <div class="notes-list-item" onclick="loadNote('Shopping: 2L Milk, Organic Eggs, Wholewheat Bread, Bananas.')">
                    🛒 Shopping: 2L Milk, Organic Eggs, Wholewheat Bread.
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast-notification">
        <span id="toastMessage">Success</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedText = localStorage.getItem('deployed_note_text');
            if (savedText) {
                document.getElementById('noteText').textContent = savedText;
            }
        });

        let currentTemplate = 'minimal';
        let currentOrientation = 'portrait';

        // Set layout orientation (landscape or portrait)
        function setOrientation(orientation) {
            currentOrientation = orientation;
            const previewBox = document.getElementById('previewBox');
            const btnLandscape = document.getElementById('btnLandscape');
            const btnPortrait = document.getElementById('btnPortrait');

            if (orientation === 'landscape') {
                document.body.classList.remove('portrait-mode');
                previewBox.classList.remove('portrait');
                btnLandscape.classList.add('active');
                btnPortrait.classList.remove('active');
            } else {
                document.body.classList.add('portrait-mode');
                previewBox.classList.add('portrait');
                btnLandscape.classList.remove('active');
                btnPortrait.classList.add('active');
            }
        }

        // Set visual background template
        function selectTemplate(templateName) {
            currentTemplate = templateName;
            const previewBox = document.getElementById('previewBox');

            // Reset background classes
            previewBox.className = 'preview-box';
            if (currentOrientation === 'portrait') {
                previewBox.classList.add('portrait');
            }

            // Apply selected template class
            previewBox.classList.add(`template-${templateName}`);

            // Update active states on cards
            const cards = document.querySelectorAll('.template-card');
            cards.forEach(card => card.classList.remove('active'));

            const activeCard = document.getElementById(`tpl-${templateName}`);
            if (activeCard) {
                activeCard.classList.add('active');
            }
        }



        // Drawer controllers
        function openNotesDrawer() {
            document.getElementById('drawerOverlay').classList.add('show');
        }

        function closeNotesDrawer() {
            document.getElementById('drawerOverlay').classList.remove('show');
        }

        function loadNote(text) {
            document.getElementById('noteText').textContent = text;
            closeNotesDrawer();
            showToast('Note content loaded into preview.', 'success');
        }

        // Deploy setting back to device via localStorage
        function triggerDeploy() {
            const textContent = document.getElementById('noteText').textContent.trim();
            if (!textContent) {
                showToast('Cannot deploy empty note!', 'error');
                return;
            }

            const deployBtn = document.getElementById('deployBtn');
            deployBtn.disabled = true;
            deployBtn.className = 'btn-deploy deploying';
            deployBtn.innerHTML = `
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="spinner" style="margin-right: 4px;">
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                </svg>
                Deploying
            `;

            showToast('Deploying to smart screen...', 'loading');

            setTimeout(() => {
                // Save deployed note text content in localStorage
                localStorage.setItem('deployed_note_text', textContent);
                localStorage.setItem('eink_now_showing', textContent);
                localStorage.setItem('currently_showing_type', 'note');
                localStorage.setItem('deployed_note_template', currentTemplate);
                localStorage.setItem('deployed_note_orientation', currentOrientation);

                deployBtn.disabled = false;
                deployBtn.className = 'btn-deploy';
                deployBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Deploy
                `;

                showToast('Successfully deployed to device!', 'success');
            }, 1800);
        }



        // Toast feedback handler
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');

            toastMsg.textContent = message;

            let iconHtml = '';
            if (type === 'loading') {
                iconHtml = `
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="spinner">
                        <line x1="12" y1="2" x2="12" y2="6"></line>
                        <line x1="12" y1="18" x2="12" y2="22"></line>
                        <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                        <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                        <line x1="2" y1="12" x2="6" y2="12"></line>
                        <line x1="18" y1="12" x2="22" y2="12"></line>
                        <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                        <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                    </svg>
                `;
            } else if (type === 'error') {
                iconHtml = `
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                `;
            } else {
                iconHtml = `
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                `;
            }

            // Remove old icon
            const oldIcon = toast.querySelector('svg');
            if (oldIcon) {
                oldIcon.remove();
            }
            toast.insertAdjacentHTML('afterbegin', iconHtml);

            toast.classList.add('show');

            if (type !== 'loading') {
                if (window.toastTimeout) {
                    clearTimeout(window.toastTimeout);
                }
                window.toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }

        // Static grid layout - no drag scrolling required
    </script>
</body>
