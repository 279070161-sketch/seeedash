<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Clock Settings - Seeedash</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Specific Styles for Clock Settings Page */
        .page-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .page-header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--foreground);
            text-align: center;
            flex: 1;
            letter-spacing: -0.01em;
        }

        .page-back-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            width: 32px;
            height: 32px;
        }

        .page-back-btn:hover {
            opacity: 0.7;
        }

        .btn-deploy {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(9, 9, 11, 0.1);
        }

        .btn-deploy:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-deploy:active {
            transform: translateY(0);
        }

        .btn-deploy.deploying {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }

        .details-content {
            padding: 1rem 1.25rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            background: #f8fafc;
            flex: 1;
        }

        /* Section Container & Titles */
        .section-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .section-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 0.25rem;
        }

        .section-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--muted-foreground);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .section-badge {
            background: rgba(9, 9, 11, 0.06);
            color: #64748b;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
        }

        /* Detail List Card */
        .detail-list-card {
            background: #ffffff;
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            padding: 0.25rem 1.25rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.015);
        }

        .detail-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 0.92rem;
            font-weight: 600;
            color: #334155;
        }

        .detail-value {
            font-size: 0.92rem;
            font-weight: 500;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
            text-align: right;
        }

        .row-clickable {
            cursor: pointer;
            transition: background-color 0.15s, opacity 0.15s;
        }

        .row-clickable:hover {
            opacity: 0.85;
        }

        /* 2x2 Templates Grid */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.88rem;
        }

        .template-card {
            background: #ffffff;
            border-radius: 1rem;
            border: 2px solid var(--border);
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 140px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.015);
        }

        .template-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
            border-color: #cbd5e1;
        }

        .template-card.selected {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(9, 9, 11, 0.06);
        }

        .template-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-align: center;
            margin-top: 8px;
            letter-spacing: -0.01em;
            transition: color 0.2s;
        }

        .template-card.selected .template-title {
            color: var(--primary);
        }

        /* Watch Face Preview Miniatures */
        .clock-preview-mini {
            width: 100%;
            height: 80px;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* Selected status indicator dot */
        .selected-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.6);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .template-card.selected .selected-indicator {
            opacity: 1;
            transform: scale(1);
        }

        /* 1. Minimal Digital Watch Face styling */
        .clock-preview-mini.digital {
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        .clock-preview-mini.digital .time-val {
            font-size: 1.65rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .clock-preview-mini.digital .date-val {
            font-size: 0.58rem;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* 2. Classic Analog Watch Face styling */
        .clock-preview-mini.analog {
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        .clock-preview-mini.analog .clock-dial {
            width: 58px;
            height: 58px;
            border: 1.5px solid #0f172a;
            border-radius: 50%;
            position: relative;
            background: #ffffff;
        }

        .clock-preview-mini.analog .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            background: #0f172a;
            transform-origin: bottom center;
            border-radius: 1px;
        }

        .clock-preview-mini.analog .clock-hand.hour {
            width: 2px;
            height: 13px;
            margin-left: -1px;
            transform: rotate(60deg);
        }

        .clock-preview-mini.analog .clock-hand.minute {
            width: 1.2px;
            height: 19px;
            margin-left: -0.6px;
            background: #64748b;
            transform: rotate(180deg);
        }

        .clock-preview-mini.analog .dial-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #0f172a;
        }

        /* 3. Fliqlo Style Watch Face styling */
        .clock-preview-mini.fliqlo {
            background: #0f172a;
            border: 1px solid #1e293b;
            flex-direction: row !important;
            gap: 6px;
            padding: 8px;
        }

        .clock-preview-mini.fliqlo .fliqlo-card {
            background: #1e293b;
            border-radius: 5px;
            width: 42px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
            border: 1px solid #2e3b4e;
        }

        .clock-preview-mini.fliqlo .fliqlo-card::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .clock-preview-mini.fliqlo .fliqlo-card span {
            font-size: 1.45rem;
            font-weight: 800;
            color: #f8fafc;
            line-height: 1;
            z-index: 1;
        }

        /* 4. Bold Typographic Watch Face styling */
        .clock-preview-mini.typographic {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            flex-direction: column;
            gap: 0;
        }

        .clock-preview-mini.typographic .typo-hours {
            font-size: 1.15rem;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -0.03em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .clock-preview-mini.typographic .typo-minutes {
            font-size: 1.15rem;
            font-weight: 900;
            color: #cbd5e1;
            letter-spacing: -0.03em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        /* Timezone Bottom Sheet Popup */
        .premium-dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .premium-dialog-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            box-shadow: 0 -10px 45px rgba(0, 0, 0, 0.18);
            width: 100%;
            max-width: 420px;
            padding: 20px 0 40px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .premium-dialog-overlay.show .bottom-sheet {
            transform: translateY(0);
        }

        .drag-handle {
            width: 38px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-bottom: 20px;
            align-self: center;
        }

        .title-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
            margin-bottom: 6px;
            padding: 0 24px;
        }

        .subtitle-text {
            font-size: 0.88rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
            padding: 0 24px;
        }

        /* Search input bar */
        .input-box-wrapper {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin: 0 24px 16px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            height: 3rem;
            transition: all 0.2s;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(9, 9, 11, 0.08);
        }

        .search-input {
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.92rem;
            color: #0f172a;
            width: 100%;
            font-weight: 500;
            height: 100%;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        /* List styling */
        .timezone-list-container {
            max-height: 220px;
            overflow-y: auto;
            margin: 0 24px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #ffffff;
        }

        .timezone-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 16px;
            border-radius: 0;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        .timezone-item:last-child {
            border-bottom: none;
        }

        .timezone-item:hover {
            background: #f8fafc;
        }

        .timezone-item.selected {
            background: rgba(9, 9, 11, 0.05);
            color: #0f172a;
            font-weight: 600;
        }

        .timezone-item-gmt {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .timezone-item.selected .timezone-item-gmt {
            color: #64748b;
            font-weight: 500;
        }

        .button-group {
            margin: 0 24px;
        }

        .btn-cancel {
            width: 100%;
            height: 3rem;
            font-weight: 700;
            border-radius: var(--radius);
            border: none;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: #e2e8f0;
        }

        /* Toast notification */
        .toast-notification {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0f172a;
            color: #ffffff;
            padding: 0.75rem 1.25rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            font-size: 0.88rem;
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Spinner keyframes */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <!-- Header -->
        <header class="page-header">
            <button class="page-back-btn" onclick="window.location.href='device_details.html'">
                <i data-lucide="chevron-left" style="width: 24px; height: 24px;"></i>
            </button>
            <div class="page-header-title" style="margin-left: 32px;">Clock</div>
            <button class="btn-deploy" id="deployBtn" onclick="triggerDeploy()">
                <!-- Inline Upload Cloud SVG -->
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Deploy
            </button>
        </header>

        <!-- Content Area -->
        <div class="details-content">
            <!-- 1. Clock Templates Area -->
            <div class="section-container">
                <div class="section-header-row">
                    <div class="section-title">Clock Templates</div>
                    <span class="section-badge">4 Available</span>
                </div>
                <div class="templates-grid">
                    <!-- Template 1: Minimal Digital -->
                    <div class="template-card" id="card_minimal_digital" onclick="selectTemplate('MINIMAL DIGITAL')">
                        <div class="selected-indicator">
                            <i data-lucide="check" style="width: 10px; height: 10px; color: #ffffff;"></i>
                        </div>
                        <div class="clock-preview-mini digital">
                            <span class="time-val">10:08</span>
                            <span class="date-val">Fri 22 May</span>
                        </div>
                        <div class="template-title">MINIMAL DIGITAL</div>
                    </div>

                    <!-- Template 2: Classic Analog -->
                    <div class="template-card" id="card_classic_analog" onclick="selectTemplate('CLASSIC ANALOG')">
                        <div class="selected-indicator">
                            <i data-lucide="check" style="width: 10px; height: 10px; color: #ffffff;"></i>
                        </div>
                        <div class="clock-preview-mini analog">
                            <div class="clock-dial">
                                <div class="clock-hand hour"></div>
                                <div class="clock-hand minute"></div>
                                <div class="dial-dot"></div>
                            </div>
                        </div>
                        <div class="template-title">CLASSIC ANALOG</div>
                    </div>

                    <!-- Template 3: Fliqlo Style -->
                    <div class="template-card" id="card_fliqlo_style" onclick="selectTemplate('FLIQLO STYLE')">
                        <div class="selected-indicator">
                            <i data-lucide="check" style="width: 10px; height: 10px; color: #ffffff;"></i>
                        </div>
                        <div class="clock-preview-mini fliqlo">
                            <div class="fliqlo-card"><span>10</span></div>
                            <div class="fliqlo-card"><span>08</span></div>
                        </div>
                        <div class="template-title">FLIQLO STYLE</div>
                    </div>

                    <!-- Template 4: Bold Typographic -->
                    <div class="template-card" id="card_bold_typographic" onclick="selectTemplate('BOLD TYPOGRAPHIC')">
                        <div class="selected-indicator">
                            <i data-lucide="check" style="width: 10px; height: 10px; color: #ffffff;"></i>
                        </div>
                        <div class="clock-preview-mini typographic">
                            <span class="typo-hours">TEN</span>
                            <span class="typo-minutes">EIGHT</span>
                        </div>
                        <div class="template-title">BOLD TYPOGRAPHIC</div>
                    </div>
                </div>
            </div>

            <!-- 2. Time Zone settings -->
            <div class="section-container" style="margin-top: 0.5rem;">
                <div class="section-title">Time Zone</div>
                <div class="detail-list-card">
                    <div class="detail-row row-clickable" onclick="openTimezonePopup()">
                        <span class="detail-value" style="color: var(--foreground); font-weight: 600; padding-right: 2px; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                            <span id="currentTimezoneText">Follow Phone (Current Location)</span>
                            <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: #94a3b8;"></i>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Timezone Bottom Sheet Modal -->
    <div class="premium-dialog-overlay" id="timezoneOverlay">
        <div class="bottom-sheet">
            <div class="drag-handle"></div>

            <h2 class="title-text">Select Time Zone</h2>
            <p class="subtitle-text">Search or select a city manually to set the timezone.</p>

            <div class="input-box-wrapper">
                <i data-lucide="search" style="width: 18px; height: 18px; color: #94a3b8; margin-right: 8px;"></i>
                <input type="text" id="timezoneSearchInput" class="search-input" placeholder="Search city or GMT..." oninput="filterTimezones()">
            </div>

            <div class="timezone-list-container" id="timezoneList">
                <!-- Timezone items will render dynamically -->
            </div>

            <div class="button-group">
                <button type="button" class="btn-cancel" onclick="closeTimezonePopup()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast-notification">
        <span id="toastMessage">Successfully connected!</span>
    </div>

    <script>
        // List of all timezones
        const timezones = [
            { name: 'Follow Phone (Current Location)', gmt: 'Auto', keywords: 'follow phone current location auto' },
            { name: 'Beijing, China', gmt: 'GMT+8', keywords: 'beijing china gmt+8 pex shanhai' },
            { name: 'Tokyo, Japan', gmt: 'GMT+9', keywords: 'tokyo japan gmt+9 tky' },
            { name: 'London, United Kingdom', gmt: 'GMT+0', keywords: 'london united kingdom gmt+0 gmt bst' },
            { name: 'New York, United States', gmt: 'GMT-5', keywords: 'new york united states gmt-5 est edt' },
            { name: 'Paris, France', gmt: 'GMT+1', keywords: 'paris france gmt+1 cet cest' },
            { name: 'Sydney, Australia', gmt: 'GMT+10', keywords: 'sydney australia gmt+10 aest' },
            { name: 'Los Angeles, United States', gmt: 'GMT-8', keywords: 'los angeles united states gmt-8 pst pdt' },
            { name: 'Singapore', gmt: 'GMT+8', keywords: 'singapore gmt+8 sgt' },
            { name: 'Berlin, Germany', gmt: 'GMT+1', keywords: 'berlin germany gmt+1 cet' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // Load current template
            let currentTemplate = localStorage.getItem('clock_template') || 'MINIMAL DIGITAL';
            if (currentTemplate === 'INDUSTRIAL MATRIX') {
                currentTemplate = 'FLIQLO STYLE';
                localStorage.setItem('clock_template', 'FLIQLO STYLE');
            }
            selectTemplateCard(currentTemplate);

            // Load current timezone
            const currentTimezone = localStorage.getItem('clock_timezone') || 'Follow Phone (Current Location)';
            document.getElementById('currentTimezoneText').textContent = currentTimezone;

            // Initialize icons
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });

        // Template Selection Handler
        function selectTemplate(name) {
            const previous = localStorage.getItem('clock_template') || 'MINIMAL DIGITAL';
            if (previous === name) return;

            localStorage.setItem('clock_template', name);
            selectTemplateCard(name);
            showToast(`Syncing clock face "${name}" to device...`, 'loading');

            setTimeout(() => {
                showToast(`Clock face synced successfully!`, 'success');
            }, 1500);
        }

        function selectTemplateCard(name) {
            // Unselect all
            document.querySelectorAll('.template-card').forEach(card => card.classList.remove('selected'));
            
            // Map name to ID
            let cardId = 'card_minimal_digital';
            if (name === 'CLASSIC ANALOG') cardId = 'card_classic_analog';
            else if (name === 'FLIQLO STYLE') cardId = 'card_fliqlo_style';
            else if (name === 'BOLD TYPOGRAPHIC') cardId = 'card_bold_typographic';

            const card = document.getElementById(cardId);
            if (card) {
                card.classList.add('selected');
            }
        }

        // Timezone popup handlers
        function openTimezonePopup() {
            document.getElementById('timezoneSearchInput').value = '';
            filterTimezones();
            document.getElementById('timezoneOverlay').classList.add('show');
            setTimeout(() => {
                document.getElementById('timezoneSearchInput').focus();
            }, 200);
        }

        function closeTimezonePopup() {
            document.getElementById('timezoneOverlay').classList.remove('show');
        }

        function filterTimezones() {
            const query = document.getElementById('timezoneSearchInput').value.toLowerCase().trim();
            const list = document.getElementById('timezoneList');
            list.innerHTML = '';
            
            const filtered = timezones.filter(tz => tz.keywords.includes(query) || tz.name.toLowerCase().includes(query) || tz.gmt.toLowerCase().includes(query));
            
            const currentTz = localStorage.getItem('clock_timezone') || 'Follow Phone (Current Location)';
            
            if (filtered.length === 0) {
                const noResult = document.createElement('div');
                noResult.style.padding = '16px';
                noResult.style.textAlign = 'center';
                noResult.style.color = '#94a3b8';
                noResult.style.fontSize = '0.88rem';
                noResult.textContent = 'No matching timezone found';
                list.appendChild(noResult);
                return;
            }
            
            filtered.forEach(tz => {
                const item = document.createElement('div');
                item.className = 'timezone-item' + (tz.name === currentTz ? ' selected' : '');
                item.onclick = () => selectTimezone(tz.name);
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = tz.name;
                
                const gmtSpan = document.createElement('span');
                gmtSpan.className = 'timezone-item-gmt';
                gmtSpan.textContent = tz.gmt;
                
                item.appendChild(nameSpan);
                item.appendChild(gmtSpan);
                list.appendChild(item);
            });
        }

        function selectTimezone(name) {
            localStorage.setItem('clock_timezone', name);
            document.getElementById('currentTimezoneText').textContent = name;
            closeTimezonePopup();
            showToast('Timezone synced to device.', 'success');
        }

        // Deploy setting back to device via localStorage
        function triggerDeploy() {
            const currentTemplate = localStorage.getItem('clock_template') || 'MINIMAL DIGITAL';
            const deployBtn = document.getElementById('deployBtn');
            deployBtn.disabled = true;
            deployBtn.className = 'btn-deploy deploying';
            deployBtn.innerHTML = `
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="spinner" style="margin-right: 4px;">
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                </svg>
                Deploying
            `;

            showToast('Deploying clock face to smart screen...', 'loading');

            setTimeout(() => {
                // Save deployed states
                localStorage.setItem('currently_showing_type', 'clock');

                deployBtn.disabled = false;
                deployBtn.className = 'btn-deploy';
                deployBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Deploy
                `;

                showToast('Clock face successfully deployed to device!', 'success');
            }, 1800);
        }

        // Toast feedback handler
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');

            toastMsg.textContent = message;

            // Remove any existing SVG icon
            const existingSvg = toast.querySelector('svg');
            if (existingSvg) {
                existingSvg.remove();
            }

            // Create new SVG icon markup
            let iconHtml = '';
            if (type === 'loading') {
                iconHtml = `
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="spinner" style="margin-right: 6px; flex-shrink: 0;">
                        <line x1="12" y1="2" x2="12" y2="6"></line>
                        <line x1="12" y1="18" x2="12" y2="22"></line>
                        <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                        <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                        <line x1="2" y1="12" x2="6" y2="12"></line>
                        <line x1="18" y1="12" x2="22" y2="12"></line>
                        <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                        <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                    </svg>
                `;
            } else {
                iconHtml = `
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; flex-shrink: 0;">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                `;
            }

            toast.insertAdjacentHTML('afterbegin', iconHtml);
            toast.classList.add('show');

            if (type !== 'loading') {
                if (window.toastTimeout) {
                    clearTimeout(window.toastTimeout);
                }
                window.toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }
    </script>
</body>

</html>
