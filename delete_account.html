    <style>
        /* Unified Page Header Styles */
        .page-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .page-header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--foreground);
            text-align: center;
            flex: 1;
            letter-spacing: -0.01em;
        }

        .page-back-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            width: 32px;
            height: 32px;
        }

        .page-back-btn:hover {
            opacity: 0.7;
        }

        .delete-content {
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            flex: 1;
            text-align: center;
        }

        .warning-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 3rem;
            gap: 1.5rem;
        }

        .alert-icon-container {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
        }

        .alert-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--foreground);
            margin: 0;
            letter-spacing: -0.02em;
        }

        .alert-description {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.6;
            margin: 0;
            max-width: 320px;
            font-weight: 500;
        }

        .action-button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: auto;
            margin-bottom: 1.5rem;
        }

        .btn-danger {
            background: #ef4444;
            color: #ffffff;
            border: none;
            width: 100%;
            height: 50px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-danger:active {
            transform: scale(0.98);
        }

        .btn-cancel {
            background: #ffffff;
            color: #64748b;
            border: 1px solid var(--border);
            width: 100%;
            height: 50px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-cancel:hover {
            background: #f1f5f9;
        }

        .btn-cancel:active {
            transform: scale(0.98);
        }
    </style>
</head>
