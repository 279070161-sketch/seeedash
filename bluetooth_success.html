<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bluetooth Success - Seeedash</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Defensive Reset inside this file to ensure box-sizing is always correct */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Mock Background styling */
        .mock-background {
            filter: blur(5px) brightness(0.85);
            pointer-events: none;
            user-select: none;
            width: 100%;
            height: 100vh;
            max-width: 420px;
            margin: 0 auto;
            background: #fafafa;
            position: relative;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: var(--space-8) var(--space-6) var(--space-3);
        }

        .dark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 5;
        }

        /* Bottom Sheet Modal Container with stretch alignment and explicit zero horizontal padding */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            box-shadow: 0 -10px 45px rgba(0, 0, 0, 0.18);
            z-index: 10;
            padding: 24px 0 48px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            max-height: 85vh;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                transform: translate(-50%, 100%);
            }

            to {
                transform: translate(-50%, 0);
            }
        }

        .drag-handle {
            width: 38px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-bottom: var(--space-6);
            align-self: center;
        }

        /* Success circular animated icon */
        .success-circle-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 1.5rem auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            z-index: 2;
            animation: icon-breath 2.5s ease-in-out infinite;
        }

        @keyframes icon-breath {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }

        .success-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--foreground);
            margin-bottom: 2rem;
            text-align: center;
            align-self: center;
        }

        /* Connected device bubble badge */
        .connected-device-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--muted);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 40px;
            margin-bottom: 3.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            align-self: center;
        }

        /* Solid Action Premium Button with absolute side margins to prevent touching edges */
        .btn-action {
            background: var(--primary);
            color: #ffffff;
            border: none;
            width: auto;
            margin: 0 24px 16px;
            font-weight: 700;
            height: 3.25rem;
            border-radius: var(--radius);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(30, 30, 32, 0.15);
        }

        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .ghost-link {
            font-size: 0.9rem;
            color: var(--muted-foreground);
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem;
            transition: color 0.2s;
            align-self: center;
        }

        .ghost-link:hover {
            color: var(--foreground);
        }
    </style>
</head>

<body style="background: #fafafa; margin: 0; padding: 0; overflow: hidden;">
    <!-- Dark Backdrop overlay -->
    <div class="dark-overlay"></div>

    <!-- Underlying Page (Blurred) -->
    <div class="mock-background">
        <h1 style="font-size: 1.85rem; font-weight: 700; color: var(--foreground); margin-bottom: 5rem;">Devices</h1>
        <div
            style="width: 120px; height: 80px; border: 4px solid #1e293b; border-radius: 10px; background: white; margin: 0 auto 3rem; opacity: 0.5;">
        </div>
        <button class="btn btn-primary" style="opacity: 0.5; width: 100%;">Connect Device</button>
    </div>

    <!-- Bluetooth Bottom Sheet -->
    <div class="bottom-sheet">
        <div class="drag-handle"></div>

        <!-- Success Animated Checkmark -->
        <div class="success-circle-container">
            <img src="success_icon.svg" class="success-icon" alt="Success">
        </div>

        <!-- Titles -->
        <h2 class="success-title">Connected Successfully</h2>

        <!-- Connected Device Badge -->
        <div class="connected-device-badge">
            <i data-lucide="bluetooth" style="width: 18px; height: 18px; color: var(--primary);"></i>
            <span style="font-size: 0.88rem; font-weight: 600; color: var(--foreground);">reTerminal Sticky
                Connected</span>
        </div>

        <!-- Actions -->
        <button class="btn-action" onclick="window.location.href='wifi_search.html'">
            Connect Wi-Fi Network
        </button>

        <a href="dashboard.html" class="ghost-link">
            Skip Wi-Fi setup
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
