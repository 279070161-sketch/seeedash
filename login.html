<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sign In - Seeedash</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        .shake-element {
            animation: shake 0.4s ease-in-out;
        }

        #agreementCheckbox {
            appearance: none !important;
            -webkit-appearance: none !important;
            width: 16px !important;
            height: 16px !important;
            padding: 0 !important;
            margin: 2px 0 0 0 !important;
            border: 1.5px solid #cbd5e1 !important;
            border-radius: 4px !important;
            outline: none !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background-color: #ffffff !important;
            transition: all 0.15s !important;
            flex-shrink: 0 !important;
            box-shadow: none !important;
        }

        #agreementCheckbox:checked {
            background-color: var(--primary) !important;
            border-color: var(--primary) !important;
        }

        #agreementCheckbox:checked::after {
            content: '' !important;
            width: 3px !important;
            height: 6px !important;
            border: solid #ffffff !important;
            border-width: 0 2px 2px 0 !important;
            transform: rotate(45deg) translate(-0.5px, -0.5px) !important;
            display: block !important;
        }

        #agreementCheckbox:hover {
            border-color: var(--primary) !important;
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <div class="container fade-in">
            <header class="auth-header">
                <img src="seeedash_logo.svg" alt="Seeedash">
                <h1>Welcome to Seeedash</h1>
            </header>

            <div class="social-grid">
                <button class="btn btn-outline" id="googleLoginBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"
                        style="margin-right: 8px;">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Continue with Google
                </button>
                <button class="btn btn-outline" id="appleLoginBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-1.07 1.66 0 3.16.59 4.15 1.76-3.01 1.76-2.53 5.92.51 7.18-.89 2.19-2.15 4.38-3.07 5.88zM15.89 4.65c.67-.81 1.12-1.95.99-3.09-1 .04-2.2.67-2.92 1.49-.62.71-1.16 1.87-1.01 2.99 1.11.08 2.27-.58 2.94-1.39z"/>
                    </svg>
                    Continue with Apple
                </button>
                <button class="btn btn-outline" id="githubLoginBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
                        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                    </svg>
                    Continue with GitHub
                </button>
            </div>

            <div class="divider">
                <span>Or</span>
            </div>

            <div class="auth-buttons-container" style="display: flex; flex-direction: column; gap: var(--space-3); width: 100%; margin-top: 0.5rem; margin-bottom: 1.5rem;">
                <button type="button" class="btn btn-primary" id="signInBtn" style="width: 100%;">Sign In</button>
                <button type="button" class="btn btn-outline" id="signUpBtn" style="width: 100%;">Sign Up</button>
            </div>

            <footer
                style="margin-top: auto; display: flex; align-items: flex-start; justify-content: center; gap: 8px; font-size: 0.74rem; color: var(--muted-foreground); line-height: 1.45; padding: 0 8px; margin-bottom: 8px; transition: transform 0.2s;">
                <input type="checkbox" id="agreementCheckbox"
                    style="width: 16px !important; height: 16px !important; padding: 0 !important; margin: 2px 0 0 0 !important; flex-shrink: 0 !important;">
                <label for="agreementCheckbox" style="cursor: pointer; user-select: none; text-align: left;">
                    I have read and agree to the <a href="#"
                        style="color: var(--foreground); font-weight: 600; text-decoration: none;">User Agreement</a>
                    and <a href="#" style="color: var(--foreground); font-weight: 600; text-decoration: none;">Privacy
                        Policy</a>
                </label>
            </footer>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script src="script.js?v=3.5"></script>
</body>

</html>
