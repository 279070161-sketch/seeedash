<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <script>
        // Dynamic routing fallback: if index.html is loaded as a server fallback for the simulator,
        // dynamically fetch and hot-inject viewer.html so the simulator loads flawlessly on any server config!
        (function() {
            let targetPage = '';
            
            // 1. Try to read from Client-side Hash parameter (e.g. #login.html)
            if (window.location.hash) {
                targetPage = window.location.hash.substring(1);
                if (targetPage.includes('?')) {
                    targetPage = targetPage.split('?')[0];
                }
            }
            
            // 2. Fall back to search query page parameter (e.g. ?page=login.html)
            if (!targetPage) {
                const urlParams = new URLSearchParams(window.location.search);
                targetPage = urlParams.get('page');
            }

            if (targetPage) {
                // Fetch and write the actual viewer.html uncached code, preserving the hash for routing!
                fetch('viewer.html' + window.location.search)
                    .then(response => response.text())
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                    })
                    .catch(err => {
                        console.error('Dynamic simulator load failed:', err);
                    });
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Seeedash</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Smooth gradient backdrop background */
        body {
            background: radial-gradient(circle, #ffffff 60%, #fafafa 100%) !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .splash-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .logo-wrapper {
            opacity: 0;
            transform: scale(0.8) translateY(12px);
            animation: logo-entrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-svg {
            width: 100px;
            height: auto;
            filter: drop-shadow(0 12px 28px rgba(9, 9, 11, 0.05));
        }

        @keyframes logo-entrance {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="splash-container">
        <div class="logo-wrapper">
            <img src="seeedash_logo.svg" class="logo-svg" alt="Seeedash Logo">
        </div>
    </div>
</body>

</html>
