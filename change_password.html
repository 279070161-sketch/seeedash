<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Change Password - Seeedash</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Unified Page Header Styles */
        .page-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .page-header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--foreground);
            text-align: center;
            flex: 1;
            letter-spacing: -0.01em;
        }

        .page-back-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            width: 32px;
            height: 32px;
        }

        .page-back-btn:hover {
            opacity: 0.7;
        }

        .edit-content {
            padding: 2rem 1.25rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background: #f8fafc;
            flex: 1;
        }

        /* Section Headings */
        .section-label-header {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            margin-left: 0.25rem;
        }

        /* Form Layout Enhancements */
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-block {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .input-card {
            background: #ffffff;
            border-radius: 1rem;
            border: 1px solid var(--border);
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.015);
        }

        .form-input {
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--foreground);
            outline: none;
            text-align: left;
            padding: 0;
            width: 100%;
            font-family: inherit;
        }

        .form-input:focus {
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            background: transparent !important;
        }

        .form-input::placeholder {
            color: #cbd5e1;
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <!-- Header -->
        <header class="page-header">
            <button class="page-back-btn" onclick="window.location.href='profile.html'" title="返回">
                <i data-lucide="chevron-left" style="width: 24px; height: 24px;"></i>
            </button>
            <div class="page-header-title">Change Password</div>
            <div style="width: 32px;"></div> <!-- Spacer to keep title centered -->
        </header>

        <!-- Content Area -->
        <div class="edit-content">
            <form id="changePasswordForm" class="form-section">
                <!-- Email Verification Code -->
                <div class="form-block">
                    <div class="section-label-header">Email Verification Code</div>
                    <div class="input-card">
                        <input type="text" id="codeVal" class="form-input" placeholder="6-digit code" maxlength="6" required>
                        <button type="button" id="sendCodeBtn" style="font-size: 0.9rem; font-weight: 700; color: var(--primary); background: transparent; border: none; cursor: pointer; flex-shrink: 0; padding-left: 10px;">Send</button>
                        <span id="timerText" style="display: none; font-size: 0.9rem; font-weight: 600; color: var(--muted-foreground); flex-shrink: 0; padding-left: 10px;">60s</span>
                    </div>
                </div>

                <!-- New Password -->
                <div class="form-block">
                    <div class="section-label-header">New Password</div>
                    <div class="input-card">
                        <input type="password" id="newPassword" class="form-input" placeholder="Min. 8 characters" minlength="8" required>
                        <button type="button" id="toggleNewPassword" style="background: transparent; border: none; cursor: pointer; color: #94a3b8; display: flex; align-items: center; justify-content: center; padding: 4px;">
                            <i data-lucide="eye-off" style="width: 18px; height: 18px;"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-block">
                    <div class="section-label-header">Confirm Password</div>
                    <div class="input-card">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat new password" minlength="8" required>
                        <button type="button" id="toggleConfirmPassword" style="background: transparent; border: none; cursor: pointer; color: #94a3b8; display: flex; align-items: center; justify-content: center; padding: 4px;">
                            <i data-lucide="eye-off" style="width: 18px; height: 18px;"></i>
                        </button>
                    </div>
                </div>

                <!-- Update Password Button -->
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; height: 50px; font-weight: 700; font-size: 1rem; border-radius: 12px;">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Init Lucide Icons
        lucide.createIcons();

        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const timerText = document.getElementById('timerText');
        const codeInput = document.getElementById('codeVal');
        
        const newPassword = document.getElementById('newPassword');
        const toggleNewPassword = document.getElementById('toggleNewPassword');
        
        const confirmPassword = document.getElementById('confirmPassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        
        const changePasswordForm = document.getElementById('changePasswordForm');

        // Send OTP Timer Action
        sendCodeBtn.addEventListener('click', () => {
            sendCodeBtn.style.display = 'none';
            timerText.style.display = 'inline';
            let seconds = 60;
            timerText.innerText = `${seconds}s`;

            const interval = setInterval(() => {
                seconds--;
                timerText.innerText = `${seconds}s`;
                if (seconds <= 0) {
                    clearInterval(interval);
                    sendCodeBtn.style.display = 'inline';
                    timerText.style.display = 'none';
                }
            }, 1000);
        });

        // Toggle New Password Visibility
        toggleNewPassword.addEventListener('click', () => {
            const isPassword = newPassword.getAttribute('type') === 'password';
            newPassword.setAttribute('type', isPassword ? 'text' : 'password');
            toggleNewPassword.innerHTML = `<i data-lucide="${isPassword ? 'eye' : 'eye-off'}" style="width: 18px; height: 18px;"></i>`;
            lucide.createIcons();
        });

        // Toggle Confirm Password Visibility
        toggleConfirmPassword.addEventListener('click', () => {
            const isPassword = confirmPassword.getAttribute('type') === 'password';
            confirmPassword.setAttribute('type', isPassword ? 'text' : 'password');
            toggleConfirmPassword.innerHTML = `<i data-lucide="${isPassword ? 'eye' : 'eye-off'}" style="width: 18px; height: 18px;"></i>`;
            lucide.createIcons();
        });

        // Submit Form Handler
        changePasswordForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // Validate code
            if (codeInput.value.length < 6) {
                alert('Please enter the 6-digit verification code.');
                return;
            }

            // Validate passwords match
            if (newPassword.value !== confirmPassword.value) {
                alert('Passwords do not match. Please verify.');
                return;
            }

            // Validate password complexity: min 8 characters and include letter + number
            const pwdVal = newPassword.value;
            const hasLetter = /[a-zA-Z]/.test(pwdVal);
            const hasNumber = /[0-9]/.test(pwdVal);
            
            if (pwdVal.length < 8) {
                alert('Password must be at least 8 characters long.');
                return;
            }

            if (!hasLetter || !hasNumber) {
                alert('Password must contain both letters and numbers.');
                return;
            }

            const updateBtn = changePasswordForm.querySelector('button[type="submit"]');
            updateBtn.innerText = 'Updating...';
            updateBtn.style.opacity = '0.7';
            updateBtn.disabled = true;

            setTimeout(() => {
                alert('Password updated successfully!');
                window.location.href = 'profile.html';
            }, 1200);
        });
    </script>
</body>

</html>
