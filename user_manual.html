<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>User Manual - Seeedash</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Unified Page Header Styles */
        .page-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .page-header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--foreground);
            text-align: center;
            flex: 1;
            letter-spacing: -0.01em;
        }

        .page-back-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            width: 32px;
            height: 32px;
        }

        .page-back-btn:hover {
            opacity: 0.7;
        }

        .manual-content {
            padding: 2rem 1.25rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background: #f8fafc;
            flex: 1;
        }

        /* Grouped List Card */
        .settings-group-card {
            background: #ffffff;
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            padding: 0.25rem 1.25rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.015);
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.15rem 0;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .setting-description {
            font-size: 0.8rem;
            font-weight: 400;
            color: #64748b;
            margin-top: 2px;
            display: block;
        }

        .label-text-container {
            display: flex;
            flex-direction: column;
        }

        .setting-icon {
            color: #64748b;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .row-arrow {
            color: #cbd5e1;
            transition: transform 0.2s, color 0.2s;
            flex-shrink: 0;
        }

        .setting-row:hover .row-arrow {
            transform: translateX(2px);
            color: var(--foreground);
        }

        .setting-row:hover .setting-icon {
            color: var(--foreground);
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <!-- Header -->
        <header class="page-header">
            <button class="page-back-btn" onclick="window.location.href='profile.html'" title="返回">
                <i data-lucide="chevron-left" style="width: 24px; height: 24px;"></i>
            </button>
            <div class="page-header-title">User Manual</div>
            <div style="width: 32px;"></div> <!-- Spacer to keep title centered -->
        </header>

        <!-- Content Area -->
        <div class="manual-content">
            <div class="settings-group-card">
                <!-- App User Manual -->
                <div class="setting-row" onclick="alert('Opening App User Manual...')">
                    <span class="setting-label">
                        <span class="setting-icon">
                            <i data-lucide="book-open" style="width: 20px; height: 20px;"></i>
                        </span>
                        <span class="label-text-container">
                            <span>App User Manual</span>
                            <span class="setting-description">App operations & features guide</span>
                        </span>
                    </span>
                    <i data-lucide="chevron-right" class="row-arrow" style="width: 18px; height: 18px;"></i>
                </div>

                <!-- Device Manual -->
                <div class="setting-row" onclick="alert('Opening Device Manual...')">
                    <span class="setting-label">
                        <span class="setting-icon">
                            <i data-lucide="cpu" style="width: 20px; height: 20px;"></i>
                        </span>
                        <span class="label-text-container">
                            <span>Device Manual</span>
                            <span class="setting-description">Hardware usage & maintenance manual</span>
                        </span>
                    </span>
                    <i data-lucide="chevron-right" class="row-arrow" style="width: 18px; height: 18px;"></i>
                </div>

                <!-- FAQ -->
                <div class="setting-row" onclick="alert('Opening FAQ...')">
                    <span class="setting-label">
                        <span class="setting-icon">
                            <i data-lucide="help-circle" style="width: 20px; height: 20px;"></i>
                        </span>
                        <span class="label-text-container">
                            <span>FAQ</span>
                            <span class="setting-description">Frequently asked questions & solutions</span>
                        </span>
                    </span>
                    <i data-lucide="chevron-right" class="row-arrow" style="width: 18px; height: 18px;"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Init Lucide Icons
        lucide.createIcons();
    </script>
</body>

</html>
